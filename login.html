<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión - Conafe</title>
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>
  <main class="container">
    <h2>Iniciar sesión</h2>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" name="email" required>
      <label>Contraseña</label>
      <input type="password" name="password" required>
      <button type="submit" class="btn">Entrar</button>
    </form>
    <p>¿No tienes cuenta? <a href="register.html">Regístrate</a></p>
    <div id="msg" class="msg"></div>
  </main>
  <script src="assets/js/app.js"></script>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async function(e){
      e.preventDefault();
      const form = e.target;
      const data = { action: 'login', email: form.email.value, password: form.password.value };
      const res = await apiPost(data);
      document.getElementById('msg').textContent = res.message || JSON.stringify(res);
      if(res.success) window.location.href = 'index.html';
    });
  </script>
</body>
</html>
